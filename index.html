<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./img/favicon.jpg">
    <title>HuyLearn – Học cùng Huy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

        :root {
            --ink: #0F0E0D;
            --paper: #F5F2EC;
            --warm: #EDE8DF;
            --rule: #D8D0C4;
            --accent: #D4541A;
            --muted: #7A7268;
            --card-bg: #FDFCF9;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--paper);
            color: var(--ink);
            min-height: 100vh;
        }

        header {
            border-bottom: 1.5px solid var(--rule);
            padding: 0 48px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
            background: var(--paper);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 1rem;
        }

        .logo span {
            color: var(--accent);
        }

        .header-tag {
            font-size: .75rem;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: .08em;
            text-transform: uppercase;
            border: 1px solid var(--rule);
            border-radius: 20px;
            padding: 4px 12px;
        }

        .site-nav {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
            min-width: 0;
            overflow-x: auto;
            scrollbar-width: thin;
        }

        .site-nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: .76rem;
            font-weight: 700;
            white-space: nowrap;
            border: 1px solid transparent;
            border-radius: 999px;
            padding: 7px 12px;
            transition: color .18s ease, border-color .18s ease, background .18s ease;
        }

        .site-nav a:hover,
        .site-nav a.active {
            color: var(--ink);
            border-color: var(--rule);
            background: var(--warm);
        }

        .home-link {
            color: inherit;
            text-decoration: none;
        }

        .hero {
            padding: 80px 48px 60px;
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 40px;
            align-items: end;
            border-bottom: 1.5px solid var(--rule);
        }

        .hero-eyebrow {
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hero-eyebrow::before {
            content: '';
            display: block;
            width: 24px;
            height: 2px;
            background: var(--accent);
        }

        .hero-title {
            font-size: clamp(2.4rem, 5vw, 3.8rem);
            font-weight: 700;
            line-height: 1.08;
            letter-spacing: -.03em;
            margin-bottom: 20px;
        }

        .hero-title em {
            font-style: normal;
            color: var(--accent);
            border-bottom: 3px solid var(--accent);
        }

        .hero-sub {
            font-size: 1rem;
            color: var(--muted);
            line-height: 1.7;
            max-width: 480px;
        }

        .stat-num {
            font-family: 'Space Mono', monospace;
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            text-align: right;
        }

        .stat-label {
            font-size: .75rem;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: .06em;
            text-transform: uppercase;
            margin-top: 4px;
            text-align: right;
        }

        .section {
            max-width: 1100px;
            margin: 0 auto;
            padding: 56px 48px;
        }

        .section-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 32px;
            border-bottom: 1.5px solid var(--rule);
            padding-bottom: 16px;
        }

        .section-title {
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .section-count {
            font-family: 'Space Mono', monospace;
            font-size: .72rem;
            color: var(--rule);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5px;
            background: var(--rule);
            border: 1.5px solid var(--rule);
            border-radius: 16px;
            overflow: hidden;
        }

        .course-card {
            background: var(--card-bg);
            padding: 32px 28px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: background .18s ease;
            position: relative;
            overflow: hidden;
            min-height: 220px;
        }

        .course-group + .course-group {
            margin-top: 48px;
        }

        .course-group .section-header {
            margin-bottom: 18px;
            padding: 16px 18px;
            border: 1.5px solid var(--rule);
            border-left: 6px solid var(--group-accent, var(--ink));
            border-radius: 12px;
            background: color-mix(in srgb, var(--group-accent, var(--warm)) 8%, var(--card-bg));
            align-items: center;
        }

        .course-group .section-title {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--ink);
            font-size: .8rem;
        }

        .course-group .section-title::before {
            content: '';
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--group-accent, var(--ink));
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--group-accent, var(--ink)) 18%, transparent);
        }

        .course-group .section-count {
            color: var(--group-accent, var(--muted));
            font-weight: 700;
        }

        .empty-group {
            padding: 24px 28px;
            border: 1.5px dashed var(--rule);
            border-radius: 16px;
            color: var(--muted);
            font-size: .85rem;
        }

        .course-card:hover {
            background: var(--warm);
        }

        .course-card:hover .card-arrow {
            transform: translate(3px, -3px);
        }

        .card-tag {
            font-size: .68rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -.02em;
            line-height: 1.25;
            margin-bottom: 10px;
        }

        .card-desc {
            font-size: .85rem;
            color: var(--muted);
            line-height: 1.6;
            flex: 1;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--rule);
        }

        .card-meta {
            font-family: 'Space Mono', monospace;
            font-size: .7rem;
            color: var(--muted);
        }

        .card-arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid var(--rule);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .9rem;
            transition: transform .2s ease;
            flex-shrink: 0;
        }

        .badge {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: .62rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 20px;
        }

        .badge-new {
            background: var(--accent);
            color: #fff;
        }

        .badge-ready {
            background: #E8F0FE;
            color: #2D6BE4;
        }

        .progress-track {
            height: 3px;
            background: var(--rule);
            border-radius: 2px;
            overflow: hidden;
            margin: 8px 0 0;
        }

        .progress-fill {
            height: 100%;
            border-radius: 2px;
        }

        /* skeleton loader */
        .skeleton {
            background: linear-gradient(90deg, var(--warm) 25%, var(--rule) 50%, var(--warm) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0
            }

            100% {
                background-position: -200% 0
            }
        }

        .sk-title {
            height: 28px;
            width: 70%;
            margin-bottom: 12px;
        }

        .sk-desc {
            height: 14px;
            width: 90%;
            margin-bottom: 6px;
        }

        .sk-desc2 {
            height: 14px;
            width: 60%;
        }

        .sk-foot {
            height: 14px;
            width: 40%;
            margin-top: 24px;
        }

        .course-shell {
            min-height: calc(100vh - 60px);
            background: var(--paper);
        }

        .outlet-bar {
            min-height: 56px;
            border-bottom: 1.5px solid var(--rule);
            padding: 10px 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: var(--warm);
        }

        .outlet-title {
            font-weight: 700;
            letter-spacing: -.01em;
        }

        .outlet-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .outlet-button {
            color: var(--ink);
            text-decoration: none;
            font-size: .76rem;
            font-weight: 700;
            border: 1.5px solid var(--rule);
            border-radius: 999px;
            padding: 7px 12px;
            background: var(--card-bg);
        }

        .course-frame {
            width: 100%;
            height: calc(100vh - 116px);
            min-height: 720px;
            border: 0;
            display: block;
            background: #fff;
        }

        footer {
            border-top: 1.5px solid var(--rule);
            padding: 24px 48px;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .footer-mono {
            font-family: 'Space Mono', monospace;
            font-size: .72rem;
            color: var(--muted);
        }

        @media(max-width: 640px) {

            header,
            .hero,
            .section,
            .outlet-bar,
            footer {
                padding-left: 20px;
                padding-right: 20px;
            }

            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
                padding-top: 14px;
                padding-bottom: 14px;
            }

            .site-nav {
                width: 100%;
            }

            .hero {
                grid-template-columns: 1fr;
            }

            .stat-num,
            .stat-label {
                text-align: left;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .outlet-bar {
                align-items: flex-start;
                flex-direction: column;
            }

            .course-frame {
                height: calc(100vh - 170px);
                min-height: 640px;
            }
        }
    </style>
</head>

<body>

    <header>
        <a class="logo home-link" href="#/">Huy<span>Learn</span></a>
        <nav class="site-nav" id="course-nav" aria-label="Khóa học"></nav>
        <div class="header-tag">Tài liệu tự học</div>
    </header>

    <main id="app-outlet">
        <div class="hero">
            <div>
                <div class="hero-eyebrow">Personal Study Hub</div>
                <h1 class="hero-title">Học gì<br>hôm nay, <em>Huy?</em></h1>
                <p class="hero-sub">Kho tài liệu tự học của bạn — từ lập trình đến tiếng Anh. Chọn khóa, mở slide, bắt
                    đầu.</p>
            </div>
            <div>
                <div class="stat-num" id="course-count">—</div>
                <div class="stat-label">khóa học</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-title">Tất cả khóa học</div>
                <div class="section-count" id="section-count">loading...</div>
            </div>
            <!-- Cards sẽ được render vào đây -->
            <div class="grid" id="course-grid"></div>
        </div>
    </main>

    <footer>
        <div class="footer-mono">© 2025 HuyLearn</div>
        <div class="footer-mono">Học chăm, code nhiều 🔥</div>
    </footer>

    <script>
        let courses = [];
        let courseGroups = [];
        const assetVersion = Date.now();

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function routeFor(course) {
            return `#/course/${encodeURIComponent(course.id)}`;
        }

        function versionedHref(href) {
            const separator = href.includes('?') ? '&' : '?';
            return `${href}${separator}_v=${assetVersion}`;
        }

        function getActiveCourse() {
            const match = location.hash.match(/^#\/course\/(.+)$/);
            if (!match) return null;
            const id = decodeURIComponent(match[1]);
            return courses.find(course => String(course.id) === id) || null;
        }

        function renderHeaderNav() {
            const nav = document.getElementById('course-nav');
            nav.innerHTML = courses.map(course => `
                <a href="${routeFor(course)}" data-course-id="${escapeHtml(course.id)}">
                    ${escapeHtml(course.title)}
                </a>
            `).join('');
        }

        function syncActiveNav() {
            const activeCourse = getActiveCourse();
            document.querySelectorAll('#course-nav a').forEach(link => {
                link.classList.toggle('active', activeCourse && link.dataset.courseId === String(activeCourse.id));
            });
        }

        function renderCard(course) {
            const badgeClass = course.badgeType === 'new' ? 'badge-new' : 'badge-ready';

            return `
      <a class="course-card" href="${routeFor(course)}">
        <span class="badge ${badgeClass}">${escapeHtml(course.badge)}</span>

        <div class="card-tag">
          <span class="card-dot" style="background:${escapeHtml(course.color)}"></span>
          ${escapeHtml(course.category)}
        </div>

        <div class="card-title">${escapeHtml(course.title)}</div>
        <div class="card-desc">${escapeHtml(course.description)}</div>

        <div class="progress-track">
          <div class="progress-fill"
               style="width:${Number(course.progress) || 0}%; background:${escapeHtml(course.color)}">
          </div>
        </div>

        <div class="card-footer">
          <div class="card-meta">${escapeHtml(course.slides)}</div>
          <div class="card-arrow">→</div>
        </div>
      </a>
    `;
        }

        function renderSkeletons(n = 3) {
            return Array.from({ length: n }, () => `
      <div class="course-card" style="pointer-events:none">
        <div class="skeleton sk-title"></div>
        <div class="skeleton sk-desc"></div>
        <div class="skeleton sk-desc2"></div>
        <div class="skeleton sk-foot"></div>
      </div>
    `).join('');
        }

        function renderCourseGroups() {
            const groupedCourses = courses.reduce((groups, course) => {
                const groupId = course.groupId || 'other';
                if (!groups[groupId]) groups[groupId] = [];
                groups[groupId].push(course);
                return groups;
            }, {});

            const newestCourseId = groupId => Math.max(
                ...((groupedCourses[groupId] || []).map(course => Number(course.id) || 0)),
                0
            );
            const declaredGroups = [...courseGroups].sort((a, b) =>
                newestCourseId(b.id) - newestCourseId(a.id)
                || (a.order ?? 999) - (b.order ?? 999)
            );
            const declaredIds = new Set(declaredGroups.map(group => group.id));
            const undeclaredGroups = Object.keys(groupedCourses)
                .filter(groupId => !declaredIds.has(groupId))
                .map(groupId => ({ id: groupId, title: groupId, order: 999 }));

            return [...declaredGroups, ...undeclaredGroups].map(group => {
                const categoryCourses = [...(groupedCourses[group.id] || [])]
                    .sort((a, b) => (Number(b.id) || 0) - (Number(a.id) || 0));
                return `
                    <section class="course-group" style="--group-accent:${escapeHtml(group.accent || '#2D6BE4')}">
                        <div class="section-header">
                            <div class="section-title">${escapeHtml(group.title)}</div>
                            <div class="section-count">${String(categoryCourses.length).padStart(2, '0')} courses</div>
                        </div>
                        ${categoryCourses.length
                            ? `<div class="grid">${categoryCourses.map(renderCard).join('')}</div>`
                            : '<div class="empty-group">Chưa có khóa học trong nhóm này.</div>'}
                    </section>
                `;
            }).join('');
        }

        function renderHome() {
            const outlet = document.getElementById('app-outlet');
            outlet.innerHTML = `
        <div class="hero">
            <div>
                <div class="hero-eyebrow">Personal Study Hub</div>
                <h1 class="hero-title">Học gì<br>hôm nay, <em>Huy?</em></h1>
                <p class="hero-sub">Kho tài liệu tự học của bạn — từ lập trình đến tiếng Anh. Chọn khóa, mở slide, bắt đầu.</p>
            </div>
            <div>
                <div class="stat-num">${courses.length}</div>
                <div class="stat-label">khóa học</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-title">Tất cả khóa học</div>
                <div class="section-count">${String(courses.length).padStart(2, '0')} courses</div>
            </div>
            ${renderCourseGroups()}
        </div>
    `;
            syncActiveNav();
        }

        function renderCourse(course) {
            const outlet = document.getElementById('app-outlet');
            outlet.innerHTML = `
        <div class="course-shell">
            <div class="outlet-bar">
                <div>
                    <div class="section-title">Đang học</div>
                    <div class="outlet-title">${escapeHtml(course.title)}</div>
                </div>
                <div class="outlet-actions">
                    <a class="outlet-button" href="#/">Trang chủ</a>
                    <a class="outlet-button" href="${escapeHtml(course.href)}" target="_blank" rel="noopener">Mở tab mới</a>
                </div>
            </div>
            <iframe class="course-frame" src="${escapeHtml(versionedHref(course.href))}" title="${escapeHtml(course.title)}"></iframe>
        </div>
    `;
            syncActiveNav();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderRoute() {
            const activeCourse = getActiveCourse();

            if (location.hash.startsWith('#/course/') && !activeCourse) {
                location.hash = '#/';
                return;
            }

            if (activeCourse) {
                renderCourse(activeCourse);
            } else {
                renderHome();
            }
        }

        async function loadCourses() {
            const grid = document.getElementById('course-grid');
            if (grid) grid.innerHTML = renderSkeletons();

            try {
                const res = await fetch('./courses.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const catalog = await res.json();
                courseGroups = Array.isArray(catalog.groups) ? catalog.groups : [];
                courses = Array.isArray(catalog.courses) ? catalog.courses : catalog;
                renderHeaderNav();
                renderRoute();
            } catch (err) {
                const outlet = document.getElementById('app-outlet');
                outlet.innerHTML = `
        <div class="section">
          <div style="padding:40px;color:var(--muted);font-size:.9rem">
            ⚠️ Không load được courses.json — hãy chạy qua local server (Live Server / Vite).
          </div>
        </div>`;
                console.error(err);
            }
        }

        window.addEventListener('hashchange', renderRoute);
        loadCourses();
    </script>
</body>

</html>
