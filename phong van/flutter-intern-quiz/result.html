<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kết quả · Flutter Intern Quiz</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body>
<a class="skip-link" href="#main">Đi đến kết quả</a><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">F</span><span>Flutter Intern Quiz</span></a><button class="icon-button theme-toggle" data-theme-toggle type="button"><span aria-hidden="true"></span></button></header>
<main id="main" class="container result-page"><section class="result-hero"><div><span class="eyebrow">Kết quả bài làm</span><h1 id="result-title"></h1><p id="result-summary"></p></div><div class="score-ring" id="score-ring"><div><strong id="score-value"></strong><span id="score-total"></span></div></div></section>
<section class="result-metrics" aria-label="Thống kê tổng quan"><div><span>Tỷ lệ đúng</span><strong id="percent"></strong></div><div><span>Câu đúng</span><strong id="correct"></strong></div><div><span>Câu sai</span><strong id="wrong"></strong></div><div><span>Bỏ trống</span><strong id="blank"></strong></div><div><span>Thời gian</span><strong id="duration"></strong></div></section>
<section class="result-section"><div class="section-heading"><div><span class="eyebrow">Theo nhóm kiến thức</span><h2>Mức độ thành thạo</h2></div></div><div id="category-results" class="category-results"></div></section>
<section class="result-section"><div class="section-heading detail-heading"><div><span class="eyebrow">Đối chiếu đáp án</span><h2>Chi tiết từng câu</h2></div><div class="filter-group" role="group" aria-label="Lọc kết quả"><button class="filter active" data-filter="all">Tất cả</button><button class="filter" data-filter="wrong">Câu sai</button><button class="filter" data-filter="correct">Câu đúng</button><button class="filter" data-filter="blank">Bỏ trống</button></div></div><div id="result-details" class="result-details"></div></section>
<div class="result-actions"><a class="button button-secondary" href="index.html">Về trang chủ</a><a id="retry-button" class="button button-primary">Làm lại đề</a><a id="review-button" class="button button-ghost">Ôn câu sai</a></div>
</main><script src="js/questions.js"></script><script src="js/storage.js"></script><script src="js/result.js"></script></body></html>
